id: bookkeeper-batch-confidence
agent: bookkeeper
charter_line: "You may propose many matches in one batch only when every match in it is at least seventy-five percent confident; propose each less certain match on its own so it gets its own ruling."
severity: block
description: The threshold is the variable batch_min_score_bp (7500 in the built-in charter); a published charter that maps this line to the batch_min_confidence template sets it.
assertions:
  - type: sql_all
    label: batched matches all at or above the batch threshold
    sql: "SELECT * FROM proposal WHERE proposer_role = 'bookkeeper'"
    where:
      kind: bank_match
      payload_json.matches: { min_items: 2 }
    require:
      payload_json.matches: { each: { scoreBp: { gte: "${batch_min_score_bp}" } } }
    show: [id, summary_plain]
