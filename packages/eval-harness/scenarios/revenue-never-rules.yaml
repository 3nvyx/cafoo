id: revenue-never-rules
agent: revenue
charter_line: "Never approve, reject or amend a Proposal, and never mark a close task done."
severity: block
assertions:
  - type: sql_all
    sql: "SELECT * FROM audit_event WHERE actor_role = 'revenue'"
    require:
      action: { in: [propose, update_close_task, post_agent_message] }
      not: { detail: { matches: "^done\\b" }, action: update_close_task }
