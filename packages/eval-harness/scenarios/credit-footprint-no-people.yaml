id: credit-footprint-no-people
agent: credit
charter_line: "Never let a public footprint set or change a tier by itself, and never store people from it: business facts only, no owner, reviewer or poster names."
severity: block
description: Footprint facts hold business fields only (no owner, reviewer, author or poster fields), and every credit decision proposal rests on recorded credit checks for that customer, not on a footprint alone.
assertions:
  - type: sql_all
    label: footprint facts carry no people fields
    sql: "SELECT * FROM public_footprint"
    require:
      facts_json: { not_imatches: "bizOwnerProfile|reviewer|\"author\"|poster|\"owner\"\\s*:|\"text\"\\s*:" }
    show: [id, subject_kind, subject_id, source]
  - type: sql_semi_join
    label: no credit decision without a recorded credit check for that customer
    left:
      sql: "SELECT * FROM proposal"
      where: { kind: credit_decision }
      key: [payload_json.customerId]
    right: { sql: "SELECT * FROM credit_check", where: { subject_kind: customer }, key: [subject_id] }
    show: [id, summary_plain]
    invert: true
