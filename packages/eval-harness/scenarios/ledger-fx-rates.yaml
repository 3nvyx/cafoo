id: ledger-fx-rates
agent: ledger
severity: block
description: Ledger integrity, across all agents. Journal lines in the subsidiary's own currency are at FX rate 1.0 (1000000); a foreign-currency line uses a rate recorded for its currency pair and its entry's month.
assertions:
