<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ef" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1511" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			// Apply a pinned theme before first paint so the page never flashes the other one.
			try {
				var t = localStorage.getItem('cafoo.theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
